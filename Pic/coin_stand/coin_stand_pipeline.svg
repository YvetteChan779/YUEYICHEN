<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Coin Stand to Place real-robot pipeline</title>
  <desc id="desc">System diagram for a real robot pipeline using xArm6, LEAP Hand, D435 and fingertip cameras, ConSensRW, ConSensPolicy, policy hot switching, grasp checking, rule-based arc motion, placement, and auto return.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef7f8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#246bfe"/>
      <stop offset="1" stop-color="#16a3b8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#17a56b"/>
      <stop offset="1" stop-color="#8bc34a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .label { font: 700 26px Inter, Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 16px Inter, Arial, sans-serif; fill: #475569; }
      .node-title { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .node-copy { font: 500 13px Inter, Arial, sans-serif; fill: #475569; }
      .tag { font: 700 12px Inter, Arial, sans-serif; fill: #0f172a; letter-spacing: .08em; }
      .small { font: 600 12px Inter, Arial, sans-serif; fill: #64748b; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #dbe5ee; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <g opacity="0.55">
    <path d="M60 118 H1140 M60 214 H1140 M60 310 H1140 M60 406 H1140 M60 502 H1140 M60 598 H1140" class="soft"/>
    <path d="M160 72 V650 M350 72 V650 M540 72 V650 M730 72 V650 M920 72 V650 M1110 72 V650" class="soft"/>
  </g>

  <text x="70" y="74" class="label">Coin Stand -> Place</text>
  <text x="70" y="105" class="sub">Real-robot closed loop: xArm6 + LEAP Hand + D435 / fingertip cameras</text>

  <g filter="url(#shadow)">
    <rect x="70" y="148" width="250" height="118" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="96" y="183" class="tag">SENSING</text>
    <text x="96" y="214" class="node-title">Coin monitor</text>
    <text x="96" y="241" class="node-copy">D435, fingertip cameras, AprilTag</text>

    <rect x="70" y="322" width="250" height="118" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="96" y="357" class="tag">DATA</text>
    <text x="96" y="388" class="node-title">Teleop and record</text>
    <text x="96" y="415" class="node-copy">record mode, pkl logs, replay tools</text>

    <rect x="392" y="148" width="304" height="292" rx="28" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="424" y="184" class="tag">REAL-WORLD RUNTIME</text>
    <text x="424" y="219" class="node-title">ConSensRW / main.py</text>
    <text x="424" y="249" class="node-copy">Hydra config, robot handles, viser UI</text>
    <text x="424" y="276" class="node-copy">policy bundles, phase flags, keyboard recovery</text>

    <rect x="424" y="308" width="108" height="76" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="448" y="342" class="node-title">STAND</text>
    <text x="446" y="365" class="node-copy">ckpt A</text>

    <rect x="560" y="308" width="108" height="76" rx="16" fill="#ecfdf5" stroke="#86efac"/>
    <text x="586" y="342" class="node-title">PLACE</text>
    <text x="584" y="365" class="node-copy">ckpt B</text>

    <rect x="766" y="148" width="344" height="118" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="792" y="183" class="tag">CHECKS</text>
    <text x="792" y="214" class="node-title">Stand and grasp verification</text>
    <text x="792" y="241" class="node-copy">HSV tilt, hand joints, ROI gold area</text>

    <rect x="766" y="322" width="344" height="118" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="792" y="357" class="tag">ARM TAKEOVER</text>
    <text x="792" y="388" class="node-title">Rule-based half-arc motion</text>
    <text x="792" y="415" class="node-copy">waypoints, blend radius, auto return</text>

    <rect x="230" y="548" width="740" height="82" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="262" y="582" class="tag">TRAINING DATA FLOW</text>
    <text x="262" y="612" class="node-copy">teleoperation demonstrations -> pickle logs -> zarr dataset -> RADIO summaries -> offline policy training -> checkpoint deployment</text>
  </g>

  <path d="M320 207 H392" class="arrow"/>
  <path d="M320 381 H392" class="arrow"/>
  <path d="M696 207 H766" class="arrow"/>
  <path d="M696 381 H766" class="arrow"/>
  <path d="M532 346 H560" class="arrow"/>
  <path d="M938 266 V322" class="arrow"/>
  <path d="M938 440 C938 512 766 512 650 440" class="arrow"/>

  <g transform="translate(990 540)">
    <rect x="0" y="34" width="92" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="16" y="18" width="60" height="20" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="-46" cy="66" r="28" fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
    <path d="M-46 40 C-25 55 -23 78 -46 92" fill="none" stroke="#92400e" stroke-width="3"/>
    <text x="-82" y="126" class="small">coin -> white box</text>
  </g>

  <g transform="translate(68 642)">
    <rect x="0" y="0" width="1064" height="38" rx="19" fill="#0f172a"/>
    <text x="32" y="25" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">System emphasis:</text>
    <text x="172" y="25" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500">real-robot deployment, policy hot switch, sensor-conditioned phase transition, conservative recovery</text>
  </g>
</svg>
