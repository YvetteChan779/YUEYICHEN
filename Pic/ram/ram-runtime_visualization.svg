<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-label="RAM runtime visualization">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2698BA"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #1f2933; }
      .subtitle { font: 500 16px Inter, Arial, sans-serif; fill: #5f6b7a; }
      .label { font: 700 17px Inter, Arial, sans-serif; fill: #1f2933; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #5f6b7a; }
      .tiny { font: 500 12px Inter, Arial, sans-serif; fill: #6c757d; }
      .box { fill: #f8fbfc; stroke: #2698BA; stroke-width: 3; rx: 16; }
      .box2 { fill: #ffffff; stroke: #d0d7de; stroke-width: 2; rx: 14; }
      .accent { fill: #2698BA; stroke: #2698BA; stroke-width: 3; rx: 16; }
      .accentText { font: 700 16px Inter, Arial, sans-serif; fill: #ffffff; }
      .arrow { stroke: #2698BA; stroke-width: 3.2; fill: none; marker-end: url(#arrow); }
      .arrowSoft { stroke: #9fb7c4; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .chip { fill: #eaf6fa; stroke: #b7dfe9; stroke-width: 1.6; rx: 999; }
      .band { fill: #f4f8fa; stroke: #dfe7ec; stroke-width: 1.6; rx: 20; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="560"/>

  <text class="title" x="640" y="54" text-anchor="middle">RAM Runtime</text>
  <text class="subtitle" x="640" y="84" text-anchor="middle">Four scripts, one data contract: ground, reconstruct, plan, then execute</text>

  <rect class="chip" x="160" y="114" width="960" height="38" rx="19"/>
  <text class="tiny" x="640" y="139" text-anchor="middle">Inputs: prompt, RGB image, depth map, template_dir, model checkpoints, robot and camera calibration files</text>

  <rect class="band" x="40" y="176" width="1200" height="248" rx="24"/>

  <rect class="accent" x="70" y="232" width="250" height="120"/>
  <text class="accentText" x="195" y="268" text-anchor="middle">step1_grounding.py</text>
  <text class="small" x="195" y="297" text-anchor="middle">VLM object discovery + 2D grounding</text>
  <text class="tiny" x="195" y="322" text-anchor="middle">Writes detections.npy and vlm_objects.json</text>

  <rect class="box" x="350" y="232" width="250" height="120"/>
  <text class="label" x="475" y="268" text-anchor="middle">step2_ram.py</text>
  <text class="small" x="475" y="297" text-anchor="middle">VGGT-1B pose / depth + RAMNet priors</text>
  <text class="tiny" x="475" y="322" text-anchor="middle">Writes ram_objects_meta.npy and vggt_depth_ext.npy</text>

  <rect class="box" x="630" y="232" width="250" height="120"/>
  <text class="label" x="755" y="268" text-anchor="middle">step3_planning.py</text>
  <text class="small" x="755" y="297" text-anchor="middle">Task decomposition into JSON subtasks</text>
  <text class="tiny" x="755" y="322" text-anchor="middle">Writes vlm_subtasks.json and vlm_actions.json</text>

  <rect class="box" x="910" y="232" width="250" height="120"/>
  <text class="label" x="1035" y="268" text-anchor="middle">step4_conducting.py</text>
  <text class="small" x="1035" y="297" text-anchor="middle">Constraint parsing and trajectory execution</text>
  <text class="tiny" x="1035" y="322" text-anchor="middle">Outputs robot waypoints and Fairino motion</text>

  <path class="arrow" d="M 320 292 L 350 292"/>
  <path class="arrow" d="M 600 292 L 630 292"/>
  <path class="arrow" d="M 880 292 L 910 292"/>

  <rect class="box2" x="86" y="394" width="220" height="60"/>
  <text class="tiny" x="196" y="420" text-anchor="middle">GroundingDINO + SAM2</text>
  <text class="tiny" x="196" y="439" text-anchor="middle">object masks and boxes</text>

  <rect class="box2" x="366" y="394" width="220" height="60"/>
  <text class="tiny" x="476" y="420" text-anchor="middle">VGGT-1B + DINOv2-B/14</text>
  <text class="tiny" x="476" y="439" text-anchor="middle">depth rescale and object geometry</text>

  <rect class="box2" x="646" y="394" width="220" height="60"/>
  <text class="tiny" x="756" y="420" text-anchor="middle">RamVLM + prompt assets</text>
  <text class="tiny" x="756" y="439" text-anchor="middle">subtasks and action constraints</text>

  <rect class="box2" x="926" y="394" width="220" height="60"/>
  <text class="tiny" x="1036" y="420" text-anchor="middle">ConstraintParser + PathPlanner</text>
  <text class="tiny" x="1036" y="439" text-anchor="middle">voxel path to robot motion</text>

  <path class="arrowSoft" d="M 196 394 L 196 352"/>
  <path class="arrowSoft" d="M 476 394 L 476 352"/>
  <path class="arrowSoft" d="M 756 394 L 756 352"/>
  <path class="arrowSoft" d="M 1036 394 L 1036 352"/>

  <rect class="chip" x="256" y="484" width="768" height="38" rx="19"/>
  <text class="tiny" x="640" y="509" text-anchor="middle">The runtime is inspectable at every boundary: numpy files, JSON files, point clouds, and explicit robot poses</text>
</svg>
